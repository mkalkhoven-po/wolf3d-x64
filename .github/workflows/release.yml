name: release

# A tag v* (git tag v0.9.0 && git push origin v0.9.0) builds both packages
# and puts them in a draft GitHub release, to read over and publish by hand.
# Pull requests that touch the packaging build the packages too (as workflow
# artifacts), so a broken package shows before the tag.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      # The toolchain the game is developed and tested with (MinGW-w64, UCRT):
      # the .exe and SDL2.dll need only the C runtime that comes with Windows.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Unit tests (no game data)
        run: ctest --test-dir build --output-on-failure
      - name: Only Windows' own DLLs needed
        run: |
          deps=$(objdump -p build/wolf3d.exe build/SDL2.dll | grep "DLL Name" | sort -u)
          echo "$deps"
          if echo "$deps" | grep -iE "libgcc|libwinpthread|libstdc|vcruntime|msvcp"; then
            echo "::error::the package would need a DLL that Windows does not have"; exit 1
          fi
      - name: Package
        run: cd build && cpack
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: build/wolf3d-x64-*-windows-x64.zip
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu LTS: the binary runs on it and anything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SDL2 and Ninja
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - name: Configure (the system's SDL2)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWOLF_FETCH_SDL2=OFF
      - name: Build
        run: cmake --build build -j
      - name: Unit tests (no game data)
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: build/wolf3d-x64-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/* --draft --title "Wolf3D x64 ${TAG#v}" --verify-tag "$@"
